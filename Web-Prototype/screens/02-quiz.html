<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MTC-EXAM · Pregunta</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main quiz-main">
      <header class="quiz-top" data-od-id="quiz-progress">
        <a class="icon-btn" href="01-dashboard.html" aria-label="Cerrar entrenamiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></a>
        <div class="progress-track" aria-label="Progreso, pregunta 4 de 200"><div class="progress-fill" style="width:2%"></div></div>
        <div class="telemetry-chip lives"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.2-8 11-8 11Z"/></svg><span class="num">3</span></div>
      </header>

      <section data-od-id="question">
        <div class="quiz-meta"><span class="category">Señales reglamentarias</span><span class="micro num">4 / 200</span></div>
        <h1 class="question">El enunciado oficial se mostrará aquí al importar el balotario.</h1>
        <div class="question-media" role="img" aria-label="Espacio para imagen oficial de la pregunta">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg><span>Imagen oficial o diagrama del banco MTC</span></div>
        </div>
        <form class="answers" aria-label="Alternativas de respuesta">
          <div><input class="answer-input" id="a" name="answer" type="radio"><label class="answer" for="a"><span class="answer-key">A</span><span>Alternativa A del banco oficial</span></label></div>
          <div><input class="answer-input" id="b" name="answer" type="radio"><label class="answer" for="b"><span class="answer-key">B</span><span>Alternativa B del banco oficial</span></label></div>
          <div><input class="answer-input" id="c" name="answer" type="radio"><label class="answer" for="c"><span class="answer-key">C</span><span>Alternativa C del banco oficial</span></label></div>
          <div><input class="answer-input" id="d" name="answer" type="radio"><label class="answer" for="d"><span class="answer-key">D</span><span>Alternativa D del banco oficial</span></label></div>
        </form>
      </section>
    </main>
    <div class="sticky-action"><a class="action" href="03-feedback.html">Comprobar respuesta</a></div>
  </div>
</body>
</html>
